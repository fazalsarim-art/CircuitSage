name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest + coverage)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: circuitsage
          POSTGRES_PASSWORD: change_me
          POSTGRES_DB: circuitsage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U circuitsage -d circuitsage"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.18.0
        ports:
          - 6333:6333
    env:
      DATABASE_URL: postgresql+psycopg://circuitsage:change_me@localhost:5432/circuitsage
      QDRANT_URL: http://localhost:6333
      QDRANT_COLLECTION: circuitsage_test
      JWT_SECRET: ci-secret-that-is-at-least-32-characters-long
      APP_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.13.14"
      - name: Install dependencies (pinned, minus Windows-only)
        run: |
          python -m pip install --upgrade pip
          grep -viE '^pywin32==' requirements.lock > /tmp/requirements.linux.txt
          pip install -r /tmp/requirements.linux.txt
      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:6333/readyz >/dev/null 2>&1 \
               || curl -fsS http://localhost:6333/ >/dev/null 2>&1; then
              echo "Qdrant ready"; exit 0
            fi
            sleep 2
          done
          echo "Qdrant did not become ready"; exit 1
      - name: Ruff
        run: python -m ruff check app tests
      - name: Migrate
        run: python -m alembic -c alembic.ini upgrade head
      - name: Pytest with coverage (>= 85%)
        run: python -m pytest -c pyproject.toml --cov=app --cov-report=term-missing --cov-fail-under=85

  frontend:
    name: Frontend (lint + typecheck + test + build + audit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Set up Node
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test -- --run
      - name: Build
        run: npm run build
      - name: Dependency audit (fail on high)
        run: npm audit --audit-level=high

  containers:
    name: Container builds
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Build backend image
        run: docker build -t circuitsage-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t circuitsage-frontend:ci --build-arg VITE_API_BASE_URL=/api/v1 ./frontend
