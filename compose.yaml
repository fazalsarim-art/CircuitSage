# CircuitSage — local development services (PostgreSQL + Qdrant)
# Dev-only credentials. Do NOT reuse these in production.
name: circuitsage

services:
  postgres:
    image: postgres:18.4
    container_name: circuitsage-postgres
    environment:
      POSTGRES_USER: circuitsage
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: circuitsage
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18+ images require the mount at /var/lib/postgresql (data lives in a
      # version-specific subdirectory), NOT /var/lib/postgresql/data.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circuitsage -d circuitsage"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: circuitsage-qdrant
    ports:
      - "6333:6333"   # REST / HTTP API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    # The Qdrant image has no curl/wget, so we probe the HTTP port with a bash TCP check.
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
