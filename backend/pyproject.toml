[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "circuitsage-backend"
version = "0.1.0"
description = "CircuitSage backend — embedded-systems documentation RAG API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "pwdlib[argon2]>=0.2",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "tiktoken>=0.7",
    "qdrant-client>=1.7",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
# Live cross-encoder reranking (heavy: torch + sentence-transformers + a model download).
# Not required for tests, which inject a deterministic fake reranker.
rerank = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"
# Autogenerated Alembic migrations are not hand-linted/formatted.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
