# CircuitSage — Render Blueprint (Infrastructure as Code).
#
# Deploys: a managed PostgreSQL, the API (Docker) with a pre-deploy migration, the ingestion/
# eval worker (Docker), and the React SPA as a static site. Qdrant is hosted separately on
# Qdrant Cloud and wired in via QDRANT_URL / QDRANT_API_KEY.
#
# SECRETS: no plaintext secret appears here. JWT_SECRET is generated by Render; OpenAI and
# Qdrant credentials are `sync: false` (entered in the dashboard, never committed); the database
# URL is injected from the managed database. CORS uses an exact origin, never a wildcard.
#
# NOTE: the service hostnames below assume the names resolve to https://<name>.onrender.com.
# After the first deploy, confirm the assigned URLs and update FRONTEND_ORIGIN and
# VITE_API_BASE_URL if Render appended a suffix. See docs/deployment-checklist.md.

databases:
  - name: circuitsage-db
    databaseName: circuitsage
    user: circuitsage
    postgresMajorVersion: "18"
    plan: basic-256mb
    region: oregon

envVarGroups:
  # Shared secrets, referenced by both backend services so they agree on JWT_SECRET.
  - name: circuitsage-secrets
    envVars:
      - key: JWT_SECRET
        generateValue: true            # Render generates a strong value; never stored in git
      - key: OPENAI_API_KEY
        sync: false                     # set in the Render dashboard
      - key: OPENAI_CHAT_MODEL
        sync: false                     # replace the spec placeholder with a real model id
      - key: QDRANT_URL
        sync: false                     # e.g. https://<cluster>.qdrant.io:6333
      - key: QDRANT_API_KEY
        sync: false

services:
  # ---- API -----------------------------------------------------------------
  - type: web
    name: circuitsage-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter
    region: oregon
    healthCheckPath: /health/ready
    # Migrate before each deploy. The image entrypoint normalizes the DATABASE_URL scheme.
    preDeployCommand: /usr/local/bin/entrypoint.sh alembic -c alembic.ini upgrade head
    # Bind Render's assigned $PORT (entrypoint still normalizes DATABASE_URL first).
    dockerCommand: /usr/local/bin/entrypoint.sh sh -c "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
    envVars:
      - fromGroup: circuitsage-secrets
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: circuitsage-db
          property: connectionString
      - key: QDRANT_COLLECTION
        value: circuitsage_chunks_v1
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSIONS
        value: "1536"
      - key: ALLOW_REGISTRATION
        value: "false"
      - key: FRONTEND_ORIGIN
        value: https://circuitsage-web.onrender.com   # exact origin (no wildcard)

  # ---- Worker (ingestion + evaluation runs) --------------------------------
  - type: worker
    name: circuitsage-worker
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter
    region: oregon
    dockerCommand: /usr/local/bin/entrypoint.sh python -m app.worker
    envVars:
      - fromGroup: circuitsage-secrets
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: circuitsage-db
          property: connectionString
      - key: QDRANT_COLLECTION
        value: circuitsage_chunks_v1
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSIONS
        value: "1536"

  # ---- Frontend SPA (static) ----------------------------------------------
  - type: web
    name: circuitsage-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      # Baked into the bundle at build time; the SPA calls the API's absolute URL (CORS).
      - key: VITE_API_BASE_URL
        value: https://circuitsage-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
